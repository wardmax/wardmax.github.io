<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Nontransitive Dice Roller</title>
  <style>
    :root{
      --size: 120px;
      --half: calc(var(--size) / 2);
      --bg: linear-gradient(180deg,#0f172a,#071033);
    }
    html,body{height:100%;}
    body{
      margin:0;display:flex;align-items:center;justify-content:center;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,'Helvetica Neue',Arial;
      background: var(--bg); color:#fff;
    }
    .wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;width:95%;max-width:1200px;padding:20px;}

    .dice-box{background:#111827;border-radius:16px;padding:16px;box-shadow:0 8px 20px rgba(0,0,0,0.6);display:flex;flex-direction:column;align-items:center;}
    h2{margin:0 0 10px;font-size:16px;text-align:center}

    .stage{width:var(--size);height:var(--size);perspective:1000px;margin-bottom:10px;}
    .scene{width:var(--size);height:var(--size);position:relative;transform-style:preserve-3d;transition: transform 1.4s cubic-bezier(.2,.9,.3,1);}
    .cube-face{
      position:absolute;width:var(--size);height:var(--size);display:flex;align-items:center;justify-content:center;
      backface-visibility:hidden;border-radius:8px; background:#fff; box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
    }

    .pips{width:80%;height:80%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:6px;align-items:center;justify-items:center;}
    .pip{width:14px;height:14px;border-radius:50%;background:#111827;}

    .face-1{ transform: translateZ(var(--half)); }
    .face-6{ transform: rotateY(180deg) translateZ(var(--half)); }
    .face-2{ transform: rotateY(90deg) translateZ(var(--half)); }
    .face-5{ transform: rotateY(-90deg) translateZ(var(--half)); }
    .face-3{ transform: rotateX(90deg) translateZ(var(--half)); }
    .face-4{ transform: rotateX(-90deg) translateZ(var(--half)); }

    .btn{background:#2563eb;color:#fff;border:none;border-radius:8px;padding:8px 12px;cursor:pointer;font-weight:600;margin-top:8px;}
    .btn:active{transform:translateY(1px);}
    .result{margin-top:6px;font-size:20px;font-weight:bold;}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="dice-box" data-die="d1">
      <h2>Dice 1 (3,3,3,3,3,3)</h2>
      <div class="stage"><div class="scene"></div></div>
      <button class="btn">Roll Dice 1</button>
      <div class="result">—</div>
    </div>

    <div class="dice-box" data-die="d2">
      <h2>Dice 2 (2,2,2,2,6,6)</h2>
      <div class="stage"><div class="scene"></div></div>
      <button class="btn">Roll Dice 2</button>
      <div class="result">—</div>
    </div>

    <div class="dice-box" data-die="d3">
      <h2>Dice 3 (1,1,1,5,5,5)</h2>
      <div class="stage"><div class="scene"></div></div>
      <button class="btn">Roll Dice 3</button>
      <div class="result">—</div>
    </div>

    <div class="dice-box" data-die="d4">
      <h2>Dice 4 (0,0,4,4,4,4)</h2>
      <div class="stage"><div class="scene"></div></div>
      <button class="btn">Roll Dice 4</button>
      <div class="result">—</div>
    </div>
  </div>

  <script>
    const diceConfigs = {
      d1: [3,3,3,3,3,3],
      d2: [2,2,2,2,6,6],
      d3: [1,1,1,5,5,5],
      d4: [0,0,4,4,4,4]
    };

    const preset = {
      1: {x:0, y:0},
      2: {x:0, y:-90},
      3: {x:90, y:0},
      4: {x:-90, y:0},
      5: {x:0, y:90},
      6: {x:0, y:180}
    };

    function randomInt(min,max){return Math.floor(Math.random()*(max-min+1))+min}

    function createPips(num){
      const grid = document.createElement('div');
      grid.className = 'pips';
      for(let i=1;i<=9;i++){
        const pip=document.createElement('div');
        pip.className='pip';
        pip.style.opacity=0;
        grid.appendChild(pip);
      }
      const visible = {
        1:[5],
        2:[3,7],
        3:[3,5,7],
        4:[1,3,7,9],
        5:[1,3,5,7,9],
        6:[1,2,3,7,8,9]
      };
      (visible[num]||[]).forEach(i=>{grid.children[i-1].style.opacity=1});
      return grid;
    }

    document.querySelectorAll('.dice-box').forEach(box=>{
      const dieName = box.dataset.die;
      const scene = box.querySelector('.scene');
      const resultEl = box.querySelector('.result');
      const values = diceConfigs[dieName];

      for(let i=1;i<=6;i++){
        const face=document.createElement('div');
        face.className = `cube-face face-${i}`;
        face.appendChild(createPips(values[i-1]));
        scene.appendChild(face);
      }

      function roll(){
        const faceIndex = randomInt(1,6);
        const value = values[faceIndex-1];
        const base = preset[faceIndex];
        const spinsX = (randomInt(2,4))*360*(Math.random()<0.5?1:-1);
        const spinsY = (randomInt(2,4))*360*(Math.random()<0.5?1:-1);
        const totalX = spinsX+base.x;
        const totalY = spinsY+base.y;
        scene.style.transition = `transform 1.4s cubic-bezier(.2,.9,.3,1)`;
        scene.style.transform = `rotateX(${totalX}deg) rotateY(${totalY}deg)`;
        resultEl.textContent = 'Rolling...';
        scene.addEventListener('transitionend',()=>{resultEl.textContent=value;},{once:true});
      }

      box.querySelector('.btn').addEventListener('click', roll);

      const start = randomInt(1,6);
      const b = preset[start];
      scene.style.transform = `rotateX(${b.x}deg) rotateY(${b.y}deg)`;
    });
  </script>
</body>
</html>
